name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare posts
        run: python3 scripts/build-posts.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          VERIFY_TOKEN: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            echo "Checking published index, attempt $attempt/12"
            if curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              "$SITE_URL?verify=$VERIFY_TOKEN" -o /tmp/index.html; then
              count=$(grep -o 'href="[^"]*/posts/[^"]*"' /tmp/index.html | wc -l || true)
              echo "Found $count post links"
              if [ "$count" -eq 10 ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published index did not expose all 10 post links"
              exit 1
            fi
            sleep 5
          done

          python3 - <<'PY'
          from html.parser import HTMLParser
          import subprocess
          from urllib.parse import urljoin

          site_url = "${{ steps.deployment.outputs.page_url }}"

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "href" and value:
                          self.hrefs.append(value)

          parser = Links()
          parser.feed(open("/tmp/index.html", encoding="utf-8").read())

          urls = {urljoin(site_url, href) for href in parser.hrefs}
          urls.add(site_url)
          urls.add(urljoin(site_url, "about/"))

          post_urls = sorted(url for url in urls if "/posts/" in url)
          urls = [site_url, urljoin(site_url, "about/")] + post_urls

          seen = set()
          for url in urls:
              if url in seen:
                  continue
              seen.add(url)
              print(f"GET {url}")
              subprocess.run([
                  "curl", "--fail", "--silent", "--show-error", "--location",
                  "--retry", "5", "--retry-delay", "2", "--retry-all-errors",
                  url, "-o", "/dev/null"
              ], check=True)

          if len(post_urls) != 10:
              raise SystemExit(
                  f"Expected 10 published post links, found {len(post_urls)}"
              )

          print(f"Verified {len(seen)} published pages.")
          PY
