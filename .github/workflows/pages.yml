name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare posts
        run: python3 scripts/build-posts.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          VERIFY_TOKEN: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            echo "Checking published pages, attempt $attempt/12"

            if curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              "$SITE_URL?verify=$VERIFY_TOKEN" -o /tmp/index.html &&
              curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              "$SITE_URL/posts/?verify=$VERIFY_TOKEN" -o /tmp/posts.html &&
              curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              "$SITE_URL/about/?verify=$VERIFY_TOKEN" -o /tmp/about.html; then
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "Published pages did not become available"
              exit 1
            fi

            sleep 5
          done

          python3 - <<'PY'
          from html.parser import HTMLParser
          import os
          import subprocess
          from urllib.parse import urljoin

          site_url = os.environ["SITE_URL"]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "href" and value:
                          self.hrefs.append(value)

          def links(path):
              parser = Links()
              parser.feed(open(path, encoding="utf-8").read())
              return {urljoin(site_url, href) for href in parser.hrefs}

          post_index_urls = links("/tmp/posts.html")
          post_urls = sorted(url for url in post_index_urls if "/posts/" in url)

          if len(post_urls) != 10:
              raise SystemExit(
                  f"Expected 10 published post links on /posts/, found {len(post_urls)}"
              )

          required = set([
              site_url,
              urljoin(site_url, "posts/"),
              urljoin(site_url, "about/"),
              *post_urls,
          ])

          for url in sorted(required):
              print(f"GET {url}")
              subprocess.run([
                  "curl", "--fail", "--silent", "--show-error", "--location",
                  "--retry", "5", "--retry-delay", "2", "--retry-all-errors",
                  url, "-o", "/dev/null"
              ], check=True)

          print(f"Verified {len(required)} published pages.")
          PY
